
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>

  <style>
    * { box-sizing: border-box; }

    body {
      max-width: 740px;
      margin: 0 auto;
      padding: 72px 24px;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.7;
      color: #242424;
      background: #fff;
      overflow-wrap: break-word;
    }

    h1, h2, h3 {
      line-height: 1.3;
      letter-spacing: -0.025em;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 24px;
    }

    h2 {
      font-size: 23px;
      margin: 40px 0 16px;
    }

    p { margin: 0 0 18px; }
    ul { padding-left: 24px; }
    li { margin-bottom: 6px; }

    a {
      color: #242424;
      text-decoration-color: #999;
      text-underline-offset: 4px;
    }

    a:hover { text-decoration-color: #242424; }

    hr {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 36px 0;
    }

    @media (max-width: 600px) {
      body { padding: 36px 20px; font-size: 16px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
